[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.9.0"
hooks = [
  { id = "betterleaks" }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-xml" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "dotnet-format",
    name = ".NET Format",
    entry = "dotnet",
    args = ["format"],
    language = "system",
    files = "\\.cs$",
    pass_filenames = false,
    stages = ["pre-push"]
  }
]
